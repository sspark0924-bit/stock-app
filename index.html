<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Matrix Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .highlight-row { box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0%, 100% { border-color: rgba(234, 179, 8, 0.8); } 50% { border-color: rgba(234, 179, 8, 0.3); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-3 sm:p-6">

    <div class="w-full max-w-2xl bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 overflow-hidden flex flex-col h-[93vh]">
        
        <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 p-4 sticky top-0 z-20 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-chart-line"></i> Stock Matrix <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30 flex items-center gap-1 inline-flex"><i class="fa-solid fa-bolt text-[10px]"></i> Ver 3.2</span>
                </h1>
                <p class="text-xs text-slate-400 mt-0.5">실시간 시세 연동 ±0.5% 20단계 계산기</p>
            </div>
            <button id="btn-reset" class="text-xs text-slate-400 hover:text-white bg-slate-700/50 hover:bg-slate-700 px-3 py-1.5 rounded-lg transition-colors">초기화</button>
        </header>

        <section class="p-4 bg-slate-800/40 border-b border-slate-800 space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">원클릭 종목 선택</label>
                <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
                    <button class="preset-btn bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-full text-slate-200 transition whitespace-nowrap" data-code="005930" data-name="삼성전자" data-buy="68000" data-qty="100">삼성전자 (005930)</button>
                    <button class="preset-btn bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-full text-slate-200 transition whitespace-nowrap" data-code="000660" data-name="SK하이닉스" data-buy="175000" data-qty="50">SK하이닉스 (000660)</button>
                    <button class="preset-btn bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-full text-slate-200 transition whitespace-nowrap" data-code="035420" data-name="NAVER" data-buy="180000" data-qty="30">NAVER (035420)</button>
                    <button class="preset-btn bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-full text-slate-200 transition whitespace-nowrap" data-code="035720" data-name="카카오" data-buy="50000" data-qty="100">카카오 (035720)</button>
                </div>
            </div>

            <div class="grid grid-cols-12 gap-2 bg-slate-950/80 p-2.5 rounded-xl border border-slate-800 items-center relative">
                <div class="col-span-4 sm:col-span-3">
                    <label for="stock-code" class="block text-[10px] text-slate-400 mb-0.5">종목코드 (6자리)</label>
                    <input type="text" id="stock-code" value="005930" maxlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-amber-400 font-mono text-center focus:outline-none focus:border-amber-500">
                </div>
                <div class="col-span-5 sm:col-span-6 relative">
                    <label for="stock-name" class="block text-[10px] text-slate-400 mb-0.5">종목명</label>
                    <input type="text" id="stock-name" value="삼성전자" placeholder="종목명" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div class="col-span-3 sm:col-span-3 flex items-end h-full pt-4">
                    <button id="btn-fetch" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-1.5 px-2 rounded-lg text-xs transition flex items-center justify-center gap-1 shadow-md">
                        <i class="fa-solid fa-arrows-rotate" id="refresh-icon"></i> 실시간 조회
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <div>
                    <label for="current-price" class="block text-xs text-slate-400 mb-1">현재가 (기준가, 원)</label>
                    <input type="number" id="current-price" value="70000" step="100" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-amber-400 font-semibold focus:outline-none">
                </div>
                <div>
                    <label for="purchase-price" class="block text-xs text-slate-400 mb-1">매수 평단가 (원)</label>
                    <input type="number" id="purchase-price" value="65000" step="100" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                </div>
                <div class="col-span-2 sm:col-span-1">
                    <label for="quantity" class="block text-xs text-slate-400 mb-1">보유 수량 (주)</label>
                    <input type="number" id="quantity" value="100" min="0" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                </div>
            </div>

            <div class="flex items-center justify-between gap-2">
                <span id="fetch-status" class="text-[11px] text-slate-400 flex items-center gap-1">
                    <i class="fa-regular fa-clock"></i> 시세 수신 대기 중
                </span>
                <button id="btn-jump" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 font-medium py-1 px-3 rounded-lg text-xs transition flex items-center gap-1">
                    <i class="fa-solid fa-crosshairs"></i> 현재가(0.0%) 위치로 이동
                </button>
            </div>

            <div id="summary-card" class="bg-slate-950/60 rounded-xl p-3 border border-slate-800 grid grid-cols-3 gap-2 text-center text-xs">
                <div><span class="text-slate-400 block">투자 원금</span><span id="sum-invest" class="font-medium text-slate-200 text-sm">-</span></div>
                <div><span class="text-slate-400 block">현재 평가액</span><span id="sum-eval" class="font-medium text-slate-200 text-sm">-</span></div>
                <div><span class="text-slate-400 block">현재 손익 (수익률)</span><span id="sum-pnl" class="font-bold text-red-400 text-sm">-</span></div>
            </div>
        </section>

        <div class="flex-1 overflow-y-auto relative" id="matrix-scroll-container">
            <table class="w-full text-left border-collapse text-xs sm:text-sm">
                <thead class="bg-slate-800 text-slate-400 sticky top-0 z-10 shadow-md">
                    <tr>
                        <th class="py-2.5 px-3 w-1/5 text-center">단계</th>
                        <th class="py-2.5 px-3 w-1/4 text-right">목표 가격</th>
                        <th class="py-2.5 px-3 w-1/6 text-right">변동률</th>
                        <th class="py-2.5 px-3 w-1/6 text-right">수익률</th>
                        <th class="py-2.5 px-3 w-1/4 text-right">예상 손익</th>
                    </tr>
                </thead>
                <tbody id="matrix-tbody" class="divide-y divide-slate-800/60"></tbody>
            </table>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const stockCodeInput = document.getElementById('stock-code');
            const stockNameInput = document.getElementById('stock-name');
            const currentPriceInput = document.getElementById('current-price');
            const purchasePriceInput = document.getElementById('purchase-price');
            const quantityInput = document.getElementById('quantity');
            
            const sumInvest = document.getElementById('sum-invest');
            const sumEval = document.getElementById('sum-eval');
            const sumPnl = document.getElementById('sum-pnl');

            const matrixTbody = document.getElementById('matrix-tbody');
            const btnFetch = document.getElementById('btn-fetch');
            const refreshIcon = document.getElementById('refresh-icon');
            const fetchStatus = document.getElementById('fetch-status');
            const btnJump = document.getElementById('btn-jump');
            const btnReset = document.getElementById('btn-reset');
            const presetBtns = document.querySelectorAll('.preset-btn');

            function formatNumber(num) {
                if (num === null || isNaN(num)) return '-';
                return new Intl.NumberFormat('ko-KR').format(num);
            }

            // 야후 파이낸스 다이렉트 API 수신 (CORS 제한 없음)
            async function fetchRealtimeStockPrice() {
                const code = stockCodeInput.value.trim();
                if (!code || code.length !== 6) {
                    alert('올바른 6자리 종목코드를 입력해주세요.');
                    return;
                }

                refreshIcon.classList.add('fa-spin');
                btnFetch.disabled = true;
                fetchStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-amber-400"></i> 실시간 시세 수신 중...`;

                try {
                    let fetchedPrice = null;
                    let fetchedName = null;

                    // 코스피(.KS) 및 코스닥(.KQ) 순차 조회
                    const symbols = [`${code}.KS`, `${code}.KQ`];

                    for (const symbol of symbols) {
                        try {
                            const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=1d`;
                            const res = await fetch(yahooUrl);
                            if (res.ok) {
                                const data = await res.json();
                                const result = data?.chart?.result?.[0];
                                if (result && result.meta && result.meta.regularMarketPrice) {
                                    fetchedPrice = Math.round(result.meta.regularMarketPrice);
                                    fetchedName = result.meta.shortName || stockNameInput.value;
                                    break;
                                }
                            }
                        } catch (e) {}
                    }

                    if (fetchedPrice) {
                        currentPriceInput.value = fetchedPrice;
                        if (fetchedName) stockNameInput.value = fetchedName;

                        const now = new Date();
                        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
                        fetchStatus.innerHTML = `<span class="text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check"></i> ${stockNameInput.value} (${code}) 연동 성공 (${timeStr})</span>`;

                        renderMatrix();
                        setTimeout(scrollToCurrentRow, 150);
                    } else {
                        throw new Error('시세를 불러올 수 없습니다. 직접 입력도 가능합니다.');
                    }

                } catch (err) {
                    console.error('Fetch Error:', err);
                    fetchStatus.innerHTML = `<span class="text-red-400"><i class="fa-solid fa-triangle-exclamation"></i> ${err.message}</span>`;
                } finally {
                    refreshIcon.classList.remove('fa-spin');
                    btnFetch.disabled = false;
                }
            }

            function renderMatrix() {
                const currentPrice = parseFloat(currentPriceInput.value) || 0;
                const purchasePrice = parseFloat(purchasePriceInput.value) || 0;
                const quantity = parseInt(quantityInput.value) || 0;

                const totalInvest = purchasePrice * quantity;
                const totalEval = currentPrice * quantity;
                const totalPnl = totalEval - totalInvest;
                const totalRoi = purchasePrice > 0 ? ((currentPrice - purchasePrice) / purchasePrice) * 100 : 0;

                sumInvest.textContent = `${formatNumber(totalInvest)}원`;
                sumEval.textContent = `${formatNumber(totalEval)}원`;

                if (purchasePrice > 0 && quantity > 0) {
                    const pnlSign = totalPnl > 0 ? '+' : '';
                    const colorClass = totalPnl > 0 ? 'text-red-400' : (totalPnl < 0 ? 'text-blue-400' : 'text-slate-300');
                    sumPnl.className = `font-bold text-sm ${colorClass}`;
                    sumPnl.textContent = `${pnlSign}${formatNumber(totalPnl)}원 (${pnlSign}${totalRoi.toFixed(2)}%)`;
                } else {
                    sumPnl.className = 'font-bold text-sm text-slate-400';
                    sumPnl.textContent = '-';
                }

                const steps = 20;
                const stepPercent = 0.005;
                let html = '';

                for (let i = steps; i >= -steps; i--) {
                    const rate = i * stepPercent;
                    const targetPrice = Math.round(currentPrice * (1 + rate));
                    const rateFromCurrent = (rate * 100).toFixed(1);

                    let roiPercent = null;
                    let expectedPnl = null;

                    if (purchasePrice > 0) {
                        roiPercent = ((targetPrice - purchasePrice) / purchasePrice) * 100;
                        expectedPnl = (targetPrice - purchasePrice) * quantity;
                    }

                    const isCurrentRow = (i === 0);

                    let stepLabel = '';
                    if (i > 0) stepLabel = `+${rateFromCurrent}% (${i}단계)`;
                    else if (i < 0) stepLabel = `${rateFromCurrent}% (${Math.abs(i)}단계)`;
                    else stepLabel = `★ 현재가 (0.0%)`;

                    let rowBgClass = 'hover:bg-slate-800/50';
                    let rateTextColor = 'text-slate-400';
                    let roiTextColor = 'text-slate-400';

                    if (i > 0) rateTextColor = 'text-red-400';
                    else if (i < 0) rateTextColor = 'text-blue-400';

                    if (roiPercent !== null) {
                        if (roiPercent > 0) roiTextColor = 'text-red-400 font-medium';
                        else if (roiPercent < 0) roiTextColor = 'text-blue-400 font-medium';
                        else roiTextColor = 'text-slate-300';
                    }

                    if (isCurrentRow) {
                        rowBgClass = 'bg-amber-500/20 border-2 border-amber-500 highlight-row';
                    }

                    html += `
                        <tr id="${isCurrentRow ? 'current-price-row' : ''}" class="${rowBgClass} transition-colors">
                            <td class="py-2.5 px-3 text-center font-medium ${isCurrentRow ? 'text-amber-300 font-bold' : 'text-slate-300'}">
                                ${stepLabel}
                            </td>
                            <td class="py-2.5 px-3 text-right font-semibold ${isCurrentRow ? 'text-amber-400 text-base' : 'text-slate-100'}">
                                ${formatNumber(targetPrice)}원
                            </td>
                            <td class="py-2.5 px-3 text-right ${rateTextColor} font-medium">
                                ${i > 0 ? '+' : ''}${rateFromCurrent}%
                            </td>
                            <td class="py-2.5 px-3 text-right ${roiTextColor}">
                                ${roiPercent !== null ? (roiPercent > 0 ? '+' : '') + roiPercent.toFixed(2) + '%' : '-'}
                            </td>
                            <td class="py-2.5 px-3 text-right ${roiTextColor}">
                                ${expectedPnl !== null ? (expectedPnl > 0 ? '+' : '') + formatNumber(expectedPnl) + '원' : '-'}
                            </td>
                        </tr>
                    `;
                }

                matrixTbody.innerHTML = html;
            }

            function scrollToCurrentRow() {
                const currentRow = document.getElementById('current-price-row');
                if (currentRow) {
                    currentRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            btnFetch.addEventListener('click', fetchRealtimeStockPrice);
            [currentPriceInput, purchasePriceInput, quantityInput].forEach(input => input.addEventListener('input', renderMatrix));
            btnJump.addEventListener('click', scrollToCurrentRow);

            btnReset.addEventListener('click', () => {
                stockCodeInput.value = '005930';
                stockNameInput.value = '삼성전자';
                currentPriceInput.value = 70000;
                purchasePriceInput.value = 65000;
                quantityInput.value = 100;
                renderMatrix();
                setTimeout(scrollToCurrentRow, 100);
            });

            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    stockCodeInput.value = btn.dataset.code;
                    stockNameInput.value = btn.dataset.name;
                    purchasePriceInput.value = btn.dataset.buy;
                    quantityInput.value = btn.dataset.qty;
                    fetchRealtimeStockPrice();
                });
            });

            renderMatrix();
            fetchRealtimeStockPrice();
        });
    </script>
</body>
</html>
